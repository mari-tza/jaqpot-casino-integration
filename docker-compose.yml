name: jaqpot-casino

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jaqpot
      POSTGRES_USER: jaqpot
      POSTGRES_PASSWORD: jaqpot_secret
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaqpot -d jaqpot"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://jaqpot:jaqpot_secret@postgres:5432/jaqpot
      PORT: 3000
      # Casino and provider live in this container and call each other here.
      BASE_URL: http://localhost:3000
      CASINO_SECRET: ${CASINO_SECRET:-casino-hmac-secret-change-in-production}
      PROVIDER_SECRET: ${PROVIDER_SECRET:-provider-hmac-secret-change-in-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
