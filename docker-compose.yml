name: jaqpot-casino

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jaqpot
      POSTGRES_USER: jaqpot
      POSTGRES_PASSWORD: jaqpot_secret
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jaqpot -d jaqpot"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
