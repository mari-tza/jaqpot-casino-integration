name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jaqpot
          POSTGRES_USER: jaqpot
          POSTGRES_PASSWORD: jaqpot_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jaqpot -d jaqpot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://jaqpot:jaqpot_secret@localhost:5432/jaqpot
      SHADOW_DATABASE_URL: postgresql://jaqpot:jaqpot_secret@localhost:5432/jaqpot_shadow
      CASINO_SECRET: ci-casino-secret
      PROVIDER_SECRET: ci-provider-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build

      - name: Migrations match the schema
        run: |
          PGPASSWORD=jaqpot_secret psql -h localhost -U jaqpot -d jaqpot -c "CREATE DATABASE jaqpot_shadow"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Apply migrations and seed
        run: |
          npm run db:deploy
          npm run db:seed

      - run: npm test

  docker:
    name: Docker compose
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Start app and database
        run: docker compose up -d --build --wait

      - run: curl -fsS localhost:3000/health

      - name: Run a round twice
        run: |
          docker compose exec -T app npm run -s simulate
          docker compose exec -T app npm run -s simulate

      - name: App logs
        if: failure()
        run: docker compose logs app
